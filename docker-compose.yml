# One-command local stack: database, API, and web client.
#
#   docker compose up --build
#
# The api service runs migrations and seeds before it starts listening, so the
# app has data the first time you open it. See README.md for the alternative
# path that runs the apps on the host against a local PostgreSQL.

name: equipment-cleaning-log

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: equipment_cleaning_log
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The API waits for this, so it never races the database on a cold start.
      test: ["CMD-SHELL", "pg_isready -U postgres -d equipment_cleaning_log"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/equipment_cleaning_log?schema=public
      JWT_SECRET: docker-compose-development-secret-not-for-production-use
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: info
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked in at build time: Vite inlines VITE_* into the bundle.
        VITE_API_URL: http://localhost:4000
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres-data:
